[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python manage.py migrate && python manage.py collectstatic --noinput && echo 'Starting gunicorn...' && gunicorn --bind 0.0.0.0:${PORT:-8000} --workers 1 --timeout 120 --log-level debug backend.wsgi:application"
numReplicas = 1
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
