version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pizzaria
      POSTGRES_USER: ${POSTGRES_USER:-pizzaria_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pizzaria_pass}
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pizzaria_user} -d pizzaria"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

  n8n:
    image: n8nio/n8n:latest
    environment:
      - TZ=America/Sao_Paulo
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL:-http://localhost:5678}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-admin123}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-pizzaria-chave-secreta-forte-123}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=pizzaria
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-pizzaria_user}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-pizzaria_pass}
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8ndata:/home/node/.n8n
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  waha:
    image: devlikeapro/waha:latest
    depends_on:
      - redis
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-pizzaria-api-key-123}
      REDIS_URL: redis://redis:6379
      WAHA_PRINT_QR: "true"
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: ${WAHA_USER:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_PASSWORD:-admin123}
      WHATSAPP_SWAGGER_ENABLED: "true"
      WHATSAPP_SWAGGER_USERNAME: ${WAHA_USER:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_PASSWORD:-admin123}
      WHATSAPP_HOOK_URL: http://n8n:5678/webhook/waha-inbound
      WHATSAPP_HOOK_EVENTS: message,session.status
      TZ: America/Sao_Paulo
    volumes:
      - wahadata:/app/.sessions

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py setup_initial_data &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 2 --timeout 120 backend.wsgi:application"
    environment:
      - TZ=America/Sao_Paulo
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-pizzaria-secret-key-muito-forte-123}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pizzaria_user}:${POSTGRES_PASSWORD:-pizzaria_pass}@db:5432/pizzaria
      - REDIS_URL=redis://redis:6379/0
      - WAHA_URL=http://waha:3000
      - WAHA_SESSION=default
      - WAHA_API_KEY=${WAHA_API_KEY:-pizzaria-api-key-123}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8000}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  n8ndata:
  wahadata:
  static_volume:
  media_volume:
